<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Půdorys Locator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #111; font-family: monospace; color: #fff; overflow-x: hidden; }

        .toolbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 200;
            background: rgba(0,0,0,0.92); border-bottom: 1px solid #333;
            padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .toolbar h1 { font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; color: #aaa; }
        .floor-tabs { display: flex; gap: 4px; }
        .floor-tab {
            padding: 5px 12px; border: 1px solid #444; border-radius: 4px;
            background: #222; color: #aaa; cursor: pointer; font-family: monospace;
            font-size: 0.78rem; font-weight: 600; transition: all 0.15s;
        }
        .floor-tab.active { background: #fd0; color: #111; border-color: #fd0; }
        .floor-tab.done { border-color: #2ecc71; color: #2ecc71; background: #1a3a1a; }
        .floor-tab.done.active { background: #2ecc71; color: #111; }
        .current-apt {
            background: #1a1a00; border: 1px solid #554; color: #fd0;
            padding: 6px 14px; border-radius: 4px; font-size: 0.85rem; font-weight: 700; letter-spacing: 1px;
        }
        .progress { font-size: 0.78rem; color: #888; }
        .mode-badge { font-size: 0.72rem; padding: 4px 10px; border-radius: 3px; }
        .mode-draw { background: #1a3a1a; color: #2ecc71; border: 1px solid #2ecc71; }
        .mode-edit { background: #1a1a3a; color: #5dade2; border: 1px solid #5dade2; }
        .btn { padding: 7px 14px; border: none; border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 0.78rem; font-weight: 600; transition: all 0.15s; }
        .btn-gray { background: #333; color: #fff; } .btn-gray:hover { background: #444; }
        .btn-red { background: #c0392b; color: #fff; } .btn-red:hover { background: #e74c3c; }
        .apt-name-wrap { display: flex; align-items: center; gap: 6px; }
        .apt-name-wrap label { font-size: 0.75rem; color: #888; }
        .apt-name-input {
            background: #222; border: 1px solid #444; color: #fff;
            padding: 5px 10px; border-radius: 4px; font-family: monospace; font-size: 0.85rem; width: 120px;
        }
        .hint { font-size: 0.73rem; color: #555; margin-left: auto; }

        .image-wrap {
            margin-top: 52px; position: relative; display: block; width: 100%;
        }
        /* hero.jpg udává výšku kontejneru — stejně jako v konfiguratoru */
        .image-wrap .size-ref { width: 100%; display: block; visibility: hidden; pointer-events: none; }
        #plan-img {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; display: block; pointer-events: none;
        }

        svg.overlay {
            position: absolute; inset: 0; width: 100%; height: 100%;
            overflow: visible; cursor: crosshair;
        }
        svg.overlay.editing { cursor: default; }

        .handle { cursor: grab; }
        .handle:active { cursor: grabbing; }

        .output-panel {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            background: rgba(0,0,0,0.95); border-top: 1px solid #333; height: 140px;
        }
        .drag-handle { height: 8px; cursor: ns-resize; display: flex; align-items: center; justify-content: center; }
        .drag-handle::before { content:''; display:block; width:40px; height:3px; background:#444; border-radius:3px; }
        .drag-handle:hover::before { background:#666; }
        .panel-body { padding: 0 20px 10px; display:flex; flex-direction:column; gap:8px; height:calc(100% - 8px); }
        .panel-top { display:flex; align-items:center; gap:10px; }
        .panel-label { font-size:0.72rem; color:#888; text-transform:uppercase; letter-spacing:1px; }
        .output-code { background:#1a1a1a; border:1px solid #333; border-radius:5px; padding:8px 12px; font-size:0.75rem; color:#0f0; line-height:1.6; overflow-y:auto; white-space:pre-wrap; word-break:break-all; flex:1; }
        .copy-btn { padding:5px 14px; background:#27ae60; color:#fff; border:none; border-radius:4px; cursor:pointer; font-family:monospace; font-size:0.75rem; font-weight:600; }
        .copy-btn:hover { background:#2ecc71; }
        .copy-all-btn { padding:5px 14px; background:#2980b9; color:#fff; border:none; border-radius:4px; cursor:pointer; font-family:monospace; font-size:0.75rem; font-weight:600; }
        .copy-all-btn:hover { background:#3498db; }
    </style>
</head>
<body>

<div class="toolbar">
    <h1>Půdorys Locator</h1>
    <div class="floor-tabs" id="floor-tabs"></div>
    <div class="current-apt" id="current-apt-label">Byt 1</div>
    <span class="progress" id="progress">0 bytů</span>
    <span class="mode-badge mode-draw" id="mode-badge">● Kreslení</span>
    <div class="apt-name-wrap">
        <label>Název bytu:</label>
        <input class="apt-name-input" id="apt-name-input" type="text" placeholder="např. GV-101" value="">
    </div>
    <button class="btn btn-gray" onclick="loadPreset()">⬇ Načíst stávající</button>
    <button class="btn btn-gray" onclick="undoLast()">↩ Zpět</button>
    <button class="btn btn-red" onclick="clearFloor()">Smazat patro</button>
    <span class="hint">Klikni 8× → byt hotov · táhni body pro úpravu</span>
</div>

<div class="image-wrap" id="image-wrap">
    <img class="size-ref" src="hero.jpg" alt="" draggable="false">
    <img id="plan-img" src="" alt="Půdorys" draggable="false">
    <svg class="overlay" id="svg-overlay" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
</div>

<div class="output-panel" id="output-panel">
    <div class="drag-handle" id="drag-handle"></div>
    <div class="panel-body">
        <div class="panel-top">
            <span class="panel-label">Výsledné polygony</span>
            <button class="copy-btn" onclick="copyOutput()">Kopírovat patro</button>
            <button class="copy-all-btn" onclick="copyAll()">Kopírovat vše</button>
        </div>
        <div class="output-code" id="output-code">// Vyber patro a klikni 8× pro každý byt...</div>
    </div>
</div>

<script>
    const FLOORS = ['1.NP','2.NP','3.NP','4.NP','5.NP','6.NP'];
    const PLAN_IMAGES = {
        '1.NP': 'plan-1np.jpg',
        '2.NP': 'plan-2np.jpg',
        '3.NP': 'plan-3np.jpg',
        '4.NP': 'plan-4np.jpg',
        '5.NP': 'plan-5np.jpg',
        '6.NP': 'plan-6np.jpg',
    };
    const POINTS_PER_APT = 8;
    const APT_COLORS = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6','#1abc9c','#e91e63','#ff5722','#00bcd4'];

    const PRESETS = {
        '1.NP': [
            { apt: "GV-101", points: [[33.61,85.73],[56.39,85.59],[56.11,63.61],[52.57,63.61],[52.57,59.35],[43.68,59.35],[43.61,50.28],[33.68,50.28]] },
            { apt: "GV-102", points: [[57.01,85.73],[70.76,85.59],[70.42,43],[58.4,42.86],[58.47,56.05],[63.33,56.05],[63.4,63.06],[56.88,62.92]] },
            { apt: "GV-103", points: [[70.35,41.9],[70.28,17.58],[52.43,17.17],[52.43,32.15],[61.88,32.28],[61.94,41.9],[70.35,42.04],[70.28,42.04]] },
            { apt: "GV-104", points: [[43.75,49.18],[33.61,49.46],[33.75,16.62],[52.36,17.17],[52.29,32.15],[50.97,32.15],[50.97,39.29],[43.75,39.43]] }
        ],
        '2.NP': [
            { apt: "GV-201", points: [[33.61,85.73],[56.39,85.59],[56.11,63.61],[52.57,63.61],[52.57,59.35],[43.68,59.35],[43.61,50.28],[33.68,50.28]] },
            { apt: "GV-202", points: [[57.01,85.73],[70.76,85.59],[70.42,43],[58.4,42.86],[58.47,56.05],[63.33,56.05],[63.4,63.06],[56.88,62.92]] },
            { apt: "GV-203", points: [[70.35,41.9],[70.28,17.58],[52.43,17.17],[52.43,32.15],[61.88,32.28],[61.94,41.9],[70.35,42.04],[70.28,42.04]] },
            { apt: "GV-204", points: [[43.75,49.18],[33.61,49.46],[33.75,16.62],[52.36,17.17],[52.29,32.15],[50.97,32.15],[50.97,39.29],[43.75,39.43]] }
        ],
        '3.NP': [
            { apt: "GV-301", points: [[33.61,85.73],[56.39,85.59],[56.11,63.61],[52.57,63.61],[52.57,59.35],[43.68,59.35],[43.61,50.28],[33.68,50.28]] },
            { apt: "GV-302", points: [[57.01,85.73],[70.76,85.59],[70.42,43],[58.4,42.86],[58.47,56.05],[63.33,56.05],[63.4,63.06],[56.88,62.92]] },
            { apt: "GV-303", points: [[70.35,41.9],[70.28,17.58],[52.43,17.17],[52.43,32.15],[61.88,32.28],[61.94,41.9],[70.35,42.04],[70.28,42.04]] },
            { apt: "GV-304", points: [[43.75,49.18],[33.61,49.46],[33.75,16.62],[52.36,17.17],[52.29,32.15],[50.97,32.15],[50.97,39.29],[43.75,39.43]] }
        ],
        '4.NP': [
            { apt: "GV-401", points: [[33.61,85.73],[56.39,85.59],[56.11,63.61],[52.57,63.61],[52.57,59.35],[43.68,59.35],[43.61,50.28],[33.68,50.28]] },
            { apt: "GV-402", points: [[57.01,85.73],[70.76,85.59],[70.42,43],[58.4,42.86],[58.47,56.05],[63.33,56.05],[63.4,63.06],[56.88,62.92]] },
            { apt: "GV-403", points: [[70.35,41.9],[70.28,17.58],[52.43,17.17],[52.43,32.15],[61.88,32.28],[61.94,41.9],[70.35,42.04],[70.28,42.04]] },
            { apt: "GV-404", points: [[43.75,49.18],[33.61,49.46],[33.75,16.62],[52.36,17.17],[52.29,32.15],[50.97,32.15],[50.97,39.29],[43.75,39.43]] }
        ],
        '5.NP': [
            { apt: "GV-501", points: [[33.61,85.73],[56.39,85.59],[56.11,63.61],[52.57,63.61],[52.57,59.35],[43.68,59.35],[43.61,50.28],[33.68,50.28]] },
            { apt: "GV-502", points: [[57.01,85.73],[70.76,85.59],[70.42,43],[58.4,42.86],[58.47,56.05],[63.33,56.05],[63.4,63.06],[56.88,62.92]] },
            { apt: "GV-503", points: [[70.35,41.9],[70.28,17.58],[52.43,17.17],[52.43,32.15],[61.88,32.28],[61.94,41.9],[70.35,42.04],[70.28,42.04]] },
            { apt: "GV-504", points: [[43.75,49.18],[33.61,49.46],[33.75,16.62],[52.36,17.17],[52.29,32.15],[50.97,32.15],[50.97,39.29],[43.75,39.43]] }
        ],
        '6.NP': [
            { apt: "GV-601", points: [[37.01,49.87],[46.18,49.59],[46.18,47.26],[51.11,47.26],[51.25,78.31],[37.01,78.31],[37.01,49.87],[37.01,49.87]] },
            { apt: "GV-602", points: [[51.81,67.59],[51.88,78.31],[65.14,78.31],[64.93,40.39],[59.72,40.39],[59.79,49.73],[57.43,49.73],[57.64,67.45]] },
            { apt: "GV-603", points: [[64.79,39.7],[64.79,22.53],[37.01,22.94],[37.08,48.77],[44.24,48.5],[44.24,38.74],[57.08,38.33],[57.08,39.7]] }
        ]
    };

    function loadPreset() {
        const p = PRESETS[currentFloor];
        if (!p) { alert(`Žádný preset pro ${currentFloor}`); return; }
        allData[currentFloor] = p.map((z, i) => ({
            name: z.apt,
            color: APT_COLORS[i % APT_COLORS.length],
            points: z.points.map(([x,y]) => ({x, y}))
        }));
        aptCounter[currentFloor] = allData[currentFloor].length + 1;
        current = [];
        render(); updateLabel(); updateOutput(); updateTabDone();
    }

    // allData[floorName] = [ { name, color, points: [{x,y}] }, ... ]
    const allData = {};
    FLOORS.forEach(f => allData[f] = []);

    let currentFloor = FLOORS[0];
    let current = [];        // points being placed for current apt
    let dragging = null;
    let aptCounter = {};
    FLOORS.forEach(f => aptCounter[f] = 1);

    const wrap  = document.getElementById('image-wrap');
    const svg   = document.getElementById('svg-overlay');
    const img   = document.getElementById('plan-img');

    /* ── build floor tabs ── */
    const tabsEl = document.getElementById('floor-tabs');
    FLOORS.forEach(f => {
        const btn = document.createElement('button');
        btn.className = 'floor-tab' + (f === currentFloor ? ' active' : '');
        btn.textContent = f;
        btn.dataset.floor = f;
        btn.onclick = () => switchFloor(f);
        tabsEl.appendChild(btn);
    });

    function switchFloor(f) {
        currentFloor = f;
        current = [];
        img.src = PLAN_IMAGES[f];
        document.querySelectorAll('.floor-tab').forEach(b => {
            b.classList.toggle('active', b.dataset.floor === f);
        });
        updateLabel();
        render();
        updateOutput();
    }

    switchFloor(FLOORS[0]);

    /* ── coordinate helpers ── */
    function clientToPct(cx, cy) {
        const r = wrap.getBoundingClientRect();
        return {
            x: parseFloat(((cx - r.left) / r.width  * 100).toFixed(2)),
            y: parseFloat(((cy - r.top)  / r.height * 100).toFixed(2))
        };
    }

    /* ── click on SVG to add point ── */
    svg.addEventListener('click', e => {
        if (dragging) return;
        if (e.target.classList.contains('handle')) return;

        const pt = clientToPct(e.clientX, e.clientY);
        current.push(pt);

        if (current.length === POINTS_PER_APT) {
            const nameInput = document.getElementById('apt-name-input');
            const aptName = nameInput.value.trim() || `Byt ${aptCounter[currentFloor]}`;
            const colorIdx = allData[currentFloor].length % APT_COLORS.length;
            allData[currentFloor].push({
                name: aptName,
                color: APT_COLORS[colorIdx],
                points: [...current]
            });
            aptCounter[currentFloor]++;
            nameInput.value = '';
            current = [];
            updateTabDone();
            updateLabel();
            updateOutput();
        }
        render();
    });

    /* ── drag handles ── */
    let dragStart = null;
    svg.addEventListener('mousedown', e => {
        if (!e.target.classList.contains('handle')) return;
        e.preventDefault();
        const zi = parseInt(e.target.dataset.zone);
        const pi = parseInt(e.target.dataset.point);
        dragging = { zi, pi };
        dragStart = { x: e.clientX, y: e.clientY };
    });

    document.addEventListener('mousemove', e => {
        if (!dragging) return;
        const pt = clientToPct(e.clientX, e.clientY);
        allData[currentFloor][dragging.zi].points[dragging.pi] = pt;
        render();
    });

    document.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = null;
        updateOutput();
    });

    /* ── undo ── */
    function undoLast() {
        if (current.length > 0) { current.pop(); }
        else if (allData[currentFloor].length > 0) {
            const z = allData[currentFloor].pop();
            current = [...z.points];
            aptCounter[currentFloor]--;
        }
        render(); updateLabel(); updateOutput(); updateTabDone();
    }

    function clearFloor() {
        if (!confirm(`Smazat všechny byty v ${currentFloor}?`)) return;
        allData[currentFloor] = [];
        aptCounter[currentFloor] = 1;
        current = [];
        render(); updateLabel(); updateOutput(); updateTabDone();
    }

    /* ── render ── */
    function ptsToSVG(pts) { return pts.map(p => `${p.x},${p.y}`).join(' '); }

    function render() {
        svg.innerHTML = '';
        const isEditing = allData[currentFloor].length > 0 && current.length === 0;
        svg.classList.toggle('editing', isEditing);

        // finished apts
        allData[currentFloor].forEach((z, zi) => {
            const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
            poly.setAttribute('points', ptsToSVG(z.points));
            poly.setAttribute('fill', hex2rgba(z.color, 0.28));
            poly.setAttribute('stroke', z.color);
            poly.setAttribute('stroke-width', '0.25');
            svg.appendChild(poly);

            const cx = z.points.reduce((s,p)=>s+p.x,0)/z.points.length;
            const cy = z.points.reduce((s,p)=>s+p.y,0)/z.points.length;
            const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
            txt.setAttribute('x', cx); txt.setAttribute('y', cy);
            txt.setAttribute('text-anchor','middle'); txt.setAttribute('dominant-baseline','middle');
            txt.setAttribute('fill','#fff'); txt.setAttribute('font-size','1.8');
            txt.setAttribute('font-family','monospace'); txt.setAttribute('font-weight','bold');
            txt.setAttribute('pointer-events','none');
            txt.textContent = z.name;
            svg.appendChild(txt);

            z.points.forEach((p, pi) => {
                const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
                c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r','0.5');
                c.setAttribute('fill', z.color); c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width','0.15');
                c.setAttribute('class','handle');
                c.dataset.zone = zi; c.dataset.point = pi;
                svg.appendChild(c);
            });
        });

        // in-progress points
        if (current.length > 0) {
            const color = APT_COLORS[allData[currentFloor].length % APT_COLORS.length];
            if (current.length > 1) {
                const pl = document.createElementNS('http://www.w3.org/2000/svg','polyline');
                pl.setAttribute('points', ptsToSVG(current));
                pl.setAttribute('fill','none'); pl.setAttribute('stroke', color);
                pl.setAttribute('stroke-width','0.4'); pl.setAttribute('stroke-dasharray','1.2 0.6');
                svg.appendChild(pl);
            }
            current.forEach((p, i) => {
                const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
                c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r','0.35');
                c.setAttribute('fill', i===0?'#fff':color);
                c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width','0.1');
                c.setAttribute('pointer-events','none');
                svg.appendChild(c);
                const h = document.createElementNS('http://www.w3.org/2000/svg','line');
                h.setAttribute('x1', p.x-1.5); h.setAttribute('y1', p.y);
                h.setAttribute('x2', p.x+1.5); h.setAttribute('y2', p.y);
                h.setAttribute('stroke', color); h.setAttribute('stroke-width','0.1');
                h.setAttribute('pointer-events','none');
                svg.appendChild(h);
                const v = document.createElementNS('http://www.w3.org/2000/svg','line');
                v.setAttribute('x1', p.x); v.setAttribute('y1', p.y-1.5);
                v.setAttribute('x2', p.x); v.setAttribute('y2', p.y+1.5);
                v.setAttribute('stroke', color); v.setAttribute('stroke-width','0.1');
                v.setAttribute('pointer-events','none');
                svg.appendChild(v);
            });

            const badge = document.createElementNS('http://www.w3.org/2000/svg','text');
            const last = current[current.length-1];
            badge.setAttribute('x', last.x+1.5); badge.setAttribute('y', last.y-1.5);
            badge.setAttribute('fill','#fd0'); badge.setAttribute('font-size','1.8');
            badge.setAttribute('font-family','monospace'); badge.setAttribute('pointer-events','none');
            badge.textContent = `${current.length}/${POINTS_PER_APT}`;
            svg.appendChild(badge);
        }
    }

    function updateLabel() {
        const n = allData[currentFloor].length;
        const nameInput = document.getElementById('apt-name-input');
        document.getElementById('current-apt-label').textContent =
            nameInput.value.trim() ? `Byt: ${nameInput.value.trim()}` : `Byt ${aptCounter[currentFloor]}`;
        document.getElementById('progress').textContent = `${n} byt${n===1?'':'ů'} v ${currentFloor}`;
        const badge = document.getElementById('mode-badge');
        if (current.length > 0) {
            badge.className = 'mode-badge mode-draw'; badge.textContent = '● Kreslení';
        } else if (n > 0) {
            badge.className = 'mode-badge mode-edit'; badge.textContent = '● Editace bodů';
        } else {
            badge.className = 'mode-badge mode-draw'; badge.textContent = '● Kreslení';
        }
    }

    document.getElementById('apt-name-input').addEventListener('input', updateLabel);

    function updateTabDone() {
        document.querySelectorAll('.floor-tab').forEach(b => {
            const f = b.dataset.floor;
            b.classList.toggle('done', allData[f].length > 0);
        });
    }

    function updateOutput() {
        const apts = allData[currentFloor];
        if (apts.length === 0) {
            document.getElementById('output-code').textContent =
                `// ${currentFloor}: žádné byty zatím...`;
            return;
        }
        const lines = apts.map(z => {
            const pts = z.points.map(p=>`[${p.x},${p.y}]`).join(',');
            return `  { apt: "${z.name}", points: [${pts}] }`;
        }).join(',\n');
        document.getElementById('output-code').textContent =
            `// ${currentFloor}\n[\n${lines}\n]`;
    }

    function copyOutput() {
        navigator.clipboard.writeText(document.getElementById('output-code').textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'Zkopírováno!'; setTimeout(()=>btn.textContent='Kopírovat patro',1500);
    }

    function copyAll() {
        const allLines = FLOORS.map(f => {
            const apts = allData[f];
            if (apts.length === 0) return null;
            const lines = apts.map(z => {
                const pts = z.points.map(p=>`[${p.x},${p.y}]`).join(',');
                return `    { apt: "${z.name}", points: [${pts}] }`;
            }).join(',\n');
            return `  // ${f}\n  apartments: [\n${lines}\n  ]`;
        }).filter(Boolean).join(',\n\n');
        navigator.clipboard.writeText(allLines);
        const btn = document.querySelector('.copy-all-btn');
        btn.textContent = 'Zkopírováno!'; setTimeout(()=>btn.textContent='Kopírovat vše',1500);
    }

    function hex2rgba(hex, a) {
        const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
        return `rgba(${r},${g},${b},${a})`;
    }

    // resizable output panel
    const panel=document.getElementById('output-panel'), handle=document.getElementById('drag-handle');
    let pd=false,psy,psh;
    handle.addEventListener('mousedown',e=>{pd=true;psy=e.clientY;psh=panel.offsetHeight;document.body.style.userSelect='none';});
    document.addEventListener('mousemove',e=>{if(!pd)return;panel.style.height=Math.max(60,Math.min(window.innerHeight-60,psh+(psy-e.clientY)))+'px';});
    document.addEventListener('mouseup',()=>{pd=false;document.body.style.userSelect='';});
</script>
</body>
</html>
