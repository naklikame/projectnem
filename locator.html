<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floor Zone Locator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #111; font-family: monospace; color: #fff; overflow-x: hidden; }

        .toolbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 200;
            background: rgba(0,0,0,0.92); border-bottom: 1px solid #333;
            padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        }
        .toolbar h1 { font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; color: #aaa; }
        .current-floor {
            background: #1a1a00; border: 1px solid #554; color: #fd0;
            padding: 6px 14px; border-radius: 4px; font-size: 0.85rem; font-weight: 700; letter-spacing: 1px;
        }
        .btn { padding: 7px 14px; border: none; border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 0.78rem; font-weight: 600; transition: all 0.15s; }
        .btn-gray { background: #333; color: #fff; } .btn-gray:hover { background: #444; }
        .btn-red { background: #c0392b; color: #fff; } .btn-red:hover { background: #e74c3c; }
        .hint { font-size: 0.73rem; color: #555; margin-left: auto; }
        .progress { font-size: 0.78rem; color: #888; }
        .mode-badge { font-size: 0.72rem; padding: 4px 10px; border-radius: 3px; }
        .mode-draw { background: #1a3a1a; color: #2ecc71; border: 1px solid #2ecc71; }
        .mode-edit { background: #1a1a3a; color: #5dade2; border: 1px solid #5dade2; }

        .image-wrap {
            margin-top: 50px; position: relative; display: block; width: 100%;
        }
        .image-wrap img { width: 100%; display: block; pointer-events: none; }

        svg.overlay {
            position: absolute; inset: 0; width: 100%; height: 100%;
            overflow: visible; cursor: crosshair;
        }
        svg.overlay.editing { cursor: default; }

        /* handle dots */
        .handle { cursor: grab; }
        .handle:active { cursor: grabbing; }

        .output-panel {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            background: rgba(0,0,0,0.95); border-top: 1px solid #333; height: 130px;
        }
        .drag-handle { height: 8px; cursor: ns-resize; display: flex; align-items: center; justify-content: center; }
        .drag-handle::before { content:''; display:block; width:40px; height:3px; background:#444; border-radius:3px; }
        .drag-handle:hover::before { background:#666; }
        .panel-body { padding: 0 20px 10px; display:flex; flex-direction:column; gap:8px; height:calc(100% - 8px); }
        .panel-top { display:flex; align-items:center; gap:10px; }
        .panel-label { font-size:0.72rem; color:#888; text-transform:uppercase; letter-spacing:1px; }
        .output-code { background:#1a1a1a; border:1px solid #333; border-radius:5px; padding:8px 12px; font-size:0.75rem; color:#0f0; line-height:1.6; overflow-y:auto; white-space:pre-wrap; word-break:break-all; flex:1; }
        .copy-btn { padding:5px 14px; background:#27ae60; color:#fff; border:none; border-radius:4px; cursor:pointer; font-family:monospace; font-size:0.75rem; font-weight:600; }
        .copy-btn:hover { background:#2ecc71; }
    </style>
</head>
<body>

<div class="toolbar">
    <h1>Floor Zone Locator</h1>
    <div class="current-floor" id="current-floor-label">Kreslím: PP</div>
    <span class="progress" id="progress">0 / 7 hotovo</span>
    <span class="mode-badge mode-draw" id="mode-badge">● Kreslení</span>
    <button class="btn btn-gray" onclick="loadPreset()">⬇ Načíst aproximaci</button>
    <button class="btn btn-gray" onclick="undoLast()">↩ Zpět</button>
    <button class="btn btn-red" onclick="clearAll()">Smazat vše</button>
    <span class="hint">Klikni 4× pro patro · pak táhni body pro úpravu</span>
</div>

<div class="image-wrap" id="image-wrap">
    <img src="hero.jpg" alt="Budova" draggable="false">
    <svg class="overlay" id="svg-overlay" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
</div>

<div class="output-panel" id="output-panel">
    <div class="drag-handle" id="drag-handle"></div>
    <div class="panel-body">
        <div class="panel-top">
            <span class="panel-label">Výsledné polygony</span>
            <button class="copy-btn" onclick="copyOutput()">Kopírovat</button>
        </div>
        <div class="output-code" id="output-code">// Klikni 4× pro každé patro...</div>
    </div>
</div>

<script>
    const floorNames  = ['1.NP','2.NP','3.NP','4.NP','5.NP','6.NP'];
    const presetZones = [
      { name: "1.NP", points: [{x:50.07,y:83.39},{x:72.99,y:66.9},{x:73.19,y:58.52},{x:50,y:74.73}] },
      { name: "2.NP", points: [{x:50,y:74.73},{x:73.19,y:58.52},{x:73.4,y:50.14},{x:50,y:64.84}] },
      { name: "3.NP", points: [{x:50,y:64.84},{x:73.4,y:50.14},{x:73.61,y:41.63},{x:50,y:54.54}] },
      { name: "4.NP", points: [{x:50,y:54.54},{x:73.68,y:41.63},{x:73.96,y:33.11},{x:50,y:44.24}] },
      { name: "5.NP", points: [{x:50,y:44.24},{x:73.96,y:33.11},{x:74.24,y:21.84},{x:49.93,y:30.5}] },
      { name: "6.NP", points: [{x:49.79,y:30.77},{x:32.71,y:23.22},{x:32.78,y:19.78},{x:35.69,y:18.68},{x:35.56,y:9.89},{x:53.61,y:14.56},{x:72.15,y:10.03},{x:71.88,y:19.1},{x:74.31,y:18.41},{x:74.44,y:22.39}] }
    ];
    const floorColors = ['#6c8ebf','#82b366','#d6b656','#ae4132','#9673a6','#23818e','#d79b00'];
    const POINTS_PER_FLOOR = 4;
    const FLOOR_POINTS = { '6.NP': 10 }; // výjimky — jinak platí POINTS_PER_FLOOR

    let zones = [];          // { name, color, points: [{x,y}] }
    let current = [];        // points being placed for next zone
    let dragging = null;     // { zoneIdx, pointIdx }
    const wrap  = document.getElementById('image-wrap');
    const svg   = document.getElementById('svg-overlay');

    /* ── coordinate helpers ── */
    function clientToPct(cx, cy) {
        const r = wrap.getBoundingClientRect();
        return {
            x: parseFloat(((cx - r.left) / r.width  * 100).toFixed(2)),
            y: parseFloat(((cy - r.top)  / r.height * 100).toFixed(2))
        };
    }

    /* ── click on SVG to add point ── */
    svg.addEventListener('click', e => {
        if (dragging) return;
        if (zones.length >= floorNames.length) return;
        // don't trigger if clicking a handle
        if (e.target.classList.contains('handle')) return;

        const pt = clientToPct(e.clientX, e.clientY);
        current.push(pt);

        const currentFloorName = floorNames[zones.length];
        const requiredPoints = FLOOR_POINTS[currentFloorName] || POINTS_PER_FLOOR;
        if (current.length === requiredPoints) {
            // auto-finish zone
            zones.push({ name: floorNames[zones.length], color: floorColors[zones.length], points: [...current] });
            current = [];
            updateLabel();
            updateOutput();
        }
        render();
    });

    /* ── drag handles to edit ── */
    let dragStart = null;

    svg.addEventListener('mousedown', e => {
        if (!e.target.classList.contains('handle')) return;
        e.preventDefault();
        const zi = parseInt(e.target.dataset.zone);
        const pi = parseInt(e.target.dataset.point);
        dragging = { zi, pi };
        dragStart = { x: e.clientX, y: e.clientY };
    });

    document.addEventListener('mousemove', e => {
        if (!dragging) return;
        const pt = clientToPct(e.clientX, e.clientY);
        zones[dragging.zi].points[dragging.pi] = pt;
        render();
    });

    document.addEventListener('mouseup', e => {
        if (!dragging) return;
        dragging = null;
        updateOutput();
    });

    /* ── undo ── */
    function undoLast() {
        if (current.length > 0) { current.pop(); }
        else if (zones.length > 0) { const z = zones.pop(); current = [...z.points]; }
        render(); updateLabel(); updateOutput();
    }

    function loadPreset() {
        zones = presetZones.map((z, i) => ({ ...z, color: floorColors[i] }));
        current = [];
        render(); updateLabel(); updateOutput();
    }

    function clearAll() {
        if (!confirm('Smazat vše?')) return;
        zones = []; current = [];
        render(); updateLabel(); updateOutput();
    }

    /* ── render ── */
    function ptsToSVG(pts) { return pts.map(p => `${p.x},${p.y}`).join(' '); }

    function render() {
        svg.innerHTML = '';
        const isEditing = zones.length > 0 && current.length === 0;
        svg.classList.toggle('editing', isEditing);

        // finished zones
        zones.forEach((z, zi) => {
            const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
            poly.setAttribute('points', ptsToSVG(z.points));
            poly.setAttribute('fill', hex2rgba(z.color, 0.28));
            poly.setAttribute('stroke', z.color);
            poly.setAttribute('stroke-width', '0.25');
            svg.appendChild(poly);

            // label at centroid
            const cx = z.points.reduce((s,p)=>s+p.x,0)/z.points.length;
            const cy = z.points.reduce((s,p)=>s+p.y,0)/z.points.length;
            const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
            txt.setAttribute('x', cx); txt.setAttribute('y', cy);
            txt.setAttribute('text-anchor','middle'); txt.setAttribute('dominant-baseline','middle');
            txt.setAttribute('fill','#fff'); txt.setAttribute('font-size','1.8');
            txt.setAttribute('font-family','monospace'); txt.setAttribute('font-weight','bold');
            txt.setAttribute('pointer-events','none');
            txt.textContent = z.name;
            svg.appendChild(txt);

            // draggable handle dots
            z.points.forEach((p, pi) => {
                const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
                c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r','0.4');
                c.setAttribute('fill', z.color); c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width','0.12');
                c.setAttribute('class','handle');
                c.dataset.zone = zi; c.dataset.point = pi;
                svg.appendChild(c);
            });
        });

        // current in-progress points
        if (current.length > 0) {
            const color = floorColors[zones.length] || '#fd0';
            if (current.length > 1) {
                const pl = document.createElementNS('http://www.w3.org/2000/svg','polyline');
                pl.setAttribute('points', ptsToSVG(current));
                pl.setAttribute('fill','none'); pl.setAttribute('stroke', color);
                pl.setAttribute('stroke-width','0.4'); pl.setAttribute('stroke-dasharray','1.2 0.6');
                svg.appendChild(pl);
            }
            current.forEach((p, i) => {
                const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
                c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', '0.3');
                c.setAttribute('fill', i===0?'#fff':color);
                c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width','0.1');
                c.setAttribute('pointer-events','none');
                svg.appendChild(c);
                // crosshair lines
                const h = document.createElementNS('http://www.w3.org/2000/svg','line');
                h.setAttribute('x1', p.x-1); h.setAttribute('y1', p.y);
                h.setAttribute('x2', p.x+1); h.setAttribute('y2', p.y);
                h.setAttribute('stroke', color); h.setAttribute('stroke-width','0.08');
                h.setAttribute('pointer-events','none');
                svg.appendChild(h);
                const v = document.createElementNS('http://www.w3.org/2000/svg','line');
                v.setAttribute('x1', p.x); v.setAttribute('y1', p.y-1);
                v.setAttribute('x2', p.x); v.setAttribute('y2', p.y+1);
                v.setAttribute('stroke', color); v.setAttribute('stroke-width','0.08');
                v.setAttribute('pointer-events','none');
                svg.appendChild(v);
            });

            // counter badge
            const badge = document.createElementNS('http://www.w3.org/2000/svg','text');
            const last = current[current.length-1];
            badge.setAttribute('x', last.x+1.5); badge.setAttribute('y', last.y-1.5);
            badge.setAttribute('fill','#fd0'); badge.setAttribute('font-size','1.8');
            badge.setAttribute('font-family','monospace'); badge.setAttribute('pointer-events','none');
            const curName = floorNames[zones.length];
            const reqPts = FLOOR_POINTS[curName] || POINTS_PER_FLOOR;
            badge.textContent = `${current.length}/${reqPts}`;
            svg.appendChild(badge);
        }
    }

    function updateLabel() {
        const next = floorNames[zones.length];
        document.getElementById('current-floor-label').textContent =
            next ? `Kreslím: ${next}` : '✓ Hotovo!';
        document.getElementById('progress').textContent =
            `${zones.length} / ${floorNames.length} hotovo`;
        const badge = document.getElementById('mode-badge');
        if (next && zones.length < floorNames.length) {
            badge.className = 'mode-badge mode-draw'; badge.textContent = '● Kreslení';
        } else {
            badge.className = 'mode-badge mode-edit'; badge.textContent = '● Editace bodů';
        }
    }

    function updateOutput() {
        if (zones.length === 0) {
            document.getElementById('output-code').textContent = '// Klikni 4× pro každé patro...';
            return;
        }
        const code = zones.map(z => {
            const pts = z.points.map(p=>`[${p.x},${p.y}]`).join(', ');
            return `  { name: "${z.name}", points: [${pts}] }`;
        }).join(',\n');
        document.getElementById('output-code').textContent = `const floors = [\n${code}\n];`;
    }

    function copyOutput() {
        navigator.clipboard.writeText(document.getElementById('output-code').textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'Zkopírováno!'; setTimeout(()=>btn.textContent='Kopírovat',1500);
    }

    function hex2rgba(hex, a) {
        const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
        return `rgba(${r},${g},${b},${a})`;
    }

    // resizable output panel
    const panel=document.getElementById('output-panel'), handle=document.getElementById('drag-handle');
    let pd=false,psy,psh;
    handle.addEventListener('mousedown',e=>{pd=true;psy=e.clientY;psh=panel.offsetHeight;document.body.style.userSelect='none';});
    document.addEventListener('mousemove',e=>{if(!pd)return;panel.style.height=Math.max(60,Math.min(window.innerHeight-60,psh+(psy-e.clientY)))+'px';});
    document.addEventListener('mouseup',()=>{pd=false;document.body.style.userSelect='';});
</script>
</body>
</html>
